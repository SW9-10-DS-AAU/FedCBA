name: Develop - Python Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-dev:
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            **/pyproject.toml
            **/poetry.lock
            **/pdm.lock
            **/uv.lock

      # 3. Install dependencies etc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tools needed to build distributions
          python -m pip install --upgrade build setuptools wheel
          pip install -e ".[ci]"
          pip install 'black[jupyter]'

      # 4. Build package if applicable
      - name: Build package
        run: python -m build
        # run: |
        #   if [ -f setup.py ]; then python setup.py build; fi
        #   if [ -f pyproject.toml ]; then python -m build; fi

      # 5. Import check
      - name: Import check
        run: python -c "import sys; import os; print('Python OK')"

      # 6. Run tests if folder exists
      - name: Run tests
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then pip install pytest && pytest; fi
